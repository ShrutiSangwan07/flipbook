<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Lucky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,400|Dancing+Script:400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Very faint background hearts -->
  <div class="bg-animation-container" id="bgAnimation" aria-hidden="true"></div>

  <!-- Background Music Sound (autoplay, unmuted)-->
  <audio id="bgMusic" preload="auto" loop autoplay>
    <source src="spotifydown.com - Dheere Dheere Se.mp3" type="audio/mpeg">
    <!-- fallback: no bg music -->
  </audio>
  <div class="book-container">
    <div class="flip-book" id="flipBook"></div>
    <div class="navigation">
      <button class="nav-btn" id="prevBtn" aria-label="Previous page">&larr; Prev</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next page">Next &rarr;</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
